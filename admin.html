<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Panitia — Mini Job Fair 2026</title>
<style>
:root{--navy:#123b5d;--blue:#1769aa;--bg:#f3f6fa;--line:#dbe3ec;--ink:#1f2937}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,sans-serif;color:var(--ink)}
main{max-width:1200px;margin:28px auto;padding:0 16px}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}
.hero{background:linear-gradient(120deg,#123b5d,#1769aa);color:#fff}.hero h1{margin:0 0 8px}.muted{color:#64748b}.hero .muted{color:#e4eef7}
input,button{font:inherit;border-radius:8px;padding:11px 13px}input{border:1px solid #cbd5e1;min-width:220px}button{border:0;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer}
button.secondary{background:#e8f1f8;color:var(--navy)}#status{margin:12px 0;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f8fafc;border:1px solid var(--line);padding:16px;border-radius:12px}.stat b{display:block;font-size:26px;color:var(--navy)}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#edf4fa;color:var(--navy)}a{color:#1769aa}
@media(max-width:650px){.stats{grid-template-columns:1fr}.hero,.panel{padding:17px}main{margin:15px auto}}
</style></head><body><main>
<header class="hero"><h1>Dashboard Panitia</h1><div>MINI JOB FAIR 2026 · UPT BALAI LATIHAN KERJA TULUNGAGUNG</div><p class="muted">Data pendaftaran perusahaan dan kebutuhan tenaga kerja.</p></header>
<section class="panel"><h3>Akses Admin</h3><input id="pin" type="password" placeholder="Masukkan PIN admin" autocomplete="current-password">
<button id="login">Masuk / Muat Data</button> <button class="secondary" id="export">Unduh Excel</button><div id="status" role="status"></div></section>
<section id="dashboard" hidden>
<div class="stats"><div class="stat"><b id="companies">0</b>Perusahaan</div><div class="stat"><b id="positions">0</b>Posisi</div><div class="stat"><b id="workers">0</b>Kebutuhan tenaga kerja</div></div>
<section class="panel"><h3>Data Perusahaan</h3><div class="table-wrap"><table id="companyTable"></table></div></section>
<section class="panel"><h3>Data Lowongan</h3><div class="table-wrap"><table id="vacancyTable"></table></div></section>
</section>
</main>
<iframe name="adminResponseFrame" id="adminResponseFrame" title="Respons server" style="display:none"></iframe>
<script>
const API_URL="/.netlify/functions/api";
async function request(action,extra={}){const r=await fetch(API_URL,{redirect:'follow',method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...extra})});let d;try{d=await r.json()}catch{throw Error('Respons server tidak valid.')};if(!r.ok||!d.ok)throw Error(d.error||'Permintaan gagal');return d.result;}
function printReceipt(row,headers){
  const get=(name)=>{const i=headers.indexOf(name);return i>=0?String(row[i]??''):''};
  const w=window.open('','_blank'); if(!w){alert('Izinkan pop-up browser untuk mencetak bukti.');return;}
  w.document.write(`<!doctype html><html><head><title>Bukti Pendaftaran ${get('ID Pendaftaran')}</title><style>body{font-family:Arial,sans-serif;margin:40px;color:#111}.paper{max-width:780px;margin:auto;border:1px solid #777;padding:35px}h1,h2{text-align:center;margin:4px}hr{margin:22px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cell{border:1px solid #ddd;padding:10px}.label{font-size:11px;color:#666;text-transform:uppercase}.value{font-weight:bold;margin-top:5px}@media print{body{margin:0}.paper{border:0}}</style></head><body><div class="paper"><h2>DINAS TENAGA KERJA DAN TRANSMIGRASI PROVINSI JAWA TIMUR</h2><h1>UPT BALAI LATIHAN KERJA TULUNGAGUNG</h1><h2 style="margin-top:25px">BUKTI PENDAFTARAN</h2><p style="text-align:center"><b>MINI JOB FAIR TAHUN 2026</b><br>24 November 2026</p><hr><div class="grid"><div class="cell"><div class="label">Nomor Pendaftaran</div><div class="value">${get('ID Pendaftaran')}</div></div><div class="cell"><div class="label">Tanggal Pendaftaran</div><div class="value">${get('Timestamp')}</div></div><div class="cell"><div class="label">Nama Perusahaan</div><div class="value">${get('Nama Perusahaan')}</div></div><div class="cell"><div class="label">Nama PIC</div><div class="value">${get('Nama PIC')}</div></div><div class="cell"><div class="label">Status Keikutsertaan</div><div class="value">${get('Status Keikutsertaan')}</div></div><div class="cell"><div class="label">Jumlah Jabatan</div><div class="value">${get('Jumlah Jabatan')}</div></div><div class="cell"><div class="label">Total Kebutuhan Tenaga Kerja</div><div class="value">${get('Total Kebutuhan Tenaga Kerja')} orang</div></div></div><p style="margin-top:24px">Bukti ini menyatakan bahwa perusahaan telah melakukan pendaftaran untuk mengikuti Mini Job Fair UPT BLK Tulungagung Tahun 2026.</p><p style="text-align:right;margin-top:55px">Panitia Mini Job Fair 2026</p></div><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close();
}
function renderTable(id,headers,rows){const table=document.getElementById(id);table.replaceChildren();const thead=document.createElement('thead'),tr=document.createElement('tr');headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;tr.appendChild(th)});thead.appendChild(tr);table.appendChild(thead);const tbody=document.createElement('tbody');rows.forEach(row=>{const r=document.createElement('tr');row.forEach((v,idx)=>{const td=document.createElement('td'),s=String(v??'');if(id==='companyTable' && idx===0){const b=document.createElement('button');b.textContent='Cetak Bukti';b.onclick=()=>printReceipt(row,headers);td.appendChild(b)}else if(/^https:\/\/(drive|docs)\.google\.com\//.test(s)){const a=document.createElement('a');a.href=s;a.target='_blank';a.rel='noopener';a.textContent='Buka file';td.appendChild(a)}else td.textContent=s;r.appendChild(td)});tbody.appendChild(r)});table.appendChild(tbody);}
document.getElementById('login').onclick=async()=>{const status=document.getElementById('status');status.textContent='Memuat data...';try{const d=await request('admin',{pin:document.getElementById('pin').value});document.getElementById('dashboard').hidden=false;document.getElementById('companies').textContent=d.stats.totalCompanies;document.getElementById('positions').textContent=d.stats.totalPositions;document.getElementById('workers').textContent=d.stats.totalWorkers;renderTable('companyTable',d.headers,d.companies);renderTable('vacancyTable',d.vacancyHeaders,d.vacancies);status.textContent='Data berhasil dimuat.';}catch(e){status.textContent='Gagal: '+e.message;}};
document.getElementById('export').onclick=async()=>{const status=document.getElementById('status');status.textContent='Menyiapkan Excel...';try{const x=await request('export',{pin:document.getElementById('pin').value});const bytes=Uint8Array.from(atob(x.base64),c=>c.charCodeAt(0));const blob=new Blob([bytes],{type:x.mimeType});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=x.filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='File Excel berhasil disiapkan.';}catch(e){status.textContent='Gagal: '+e.message;}};
</script></body></html>
